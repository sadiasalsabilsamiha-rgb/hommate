<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeMate – Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-left">
      <div class="logo">🏠</div>
      <h2>HomeMate</h2>
      <p>Better Home. Happier Life.</p>
      <p style="margin-top:30px">Manage your home,<br>plan your days, live better.</p>
    </div>
    <div class="auth-right">
      <div class="tabs">
        <button id="tabLogin" class="on">Login</button>
        <button id="tabReg">Register</button>
      </div>
      <h3 id="heading" style="margin-bottom:4px">Welcome Back!</h3>
      <p id="sub" style="color:var(--muted);font-size:12px;margin-bottom:18px">Log in to your HomeMate account</p>

      <form id="form">
        <div class="field" id="nameField" style="display:none"><input id="name" placeholder="Full name"></div>
        <div class="field"><input id="email" type="email" placeholder="Email address" required></div>
        <div class="field"><input id="password" type="password" placeholder="Password" required></div>
        <div class="msg" id="msg"></div>
        <button class="btn block" id="submit">Login</button>
      </form>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  if (Api.currentUser()) location.href = 'dashboard.html';

  let mode = 'login';
  const $ = id => document.getElementById(id);

  function setMode(m) {
    mode = m;
    const login = m === 'login';
    $('tabLogin').classList.toggle('on', login);
    $('tabReg').classList.toggle('on', !login);
    $('nameField').style.display = login ? 'none' : 'block';
    $('heading').textContent = login ? 'Welcome Back!' : 'Create Account';
    $('sub').textContent = login ? 'Log in to your HomeMate account' : 'Register to start using HomeMate';
    $('submit').textContent = login ? 'Login' : 'Register';
    $('msg').textContent = '';
  }
  $('tabLogin').onclick = () => setMode('login');
  $('tabReg').onclick = () => setMode('register');

  $('form').onsubmit = async e => {
    e.preventDefault();
    const body = { name: $('name').value.trim(), email: $('email').value.trim(), password: $('password').value };
    try {
      await (mode === 'login' ? Api.login(body) : Api.register(body));
      location.href = 'dashboard.html';
    } catch (err) { $('msg').textContent = err.message; }
  };
</script>
</body>
</html>
